# Actualiza los datos reales de la Escuela de Limoncito (módulo de datos y automatización, Grupo 3).
#
# - Se ejecuta a mano (Actions > "Datos Limoncito" > Run workflow), al subir cambios a los scripts
#   y todos los días a las 6:15 a. m. hora de Costa Rica (la programación diaria solo funciona
#   cuando este archivo está en la rama principal).
# - Las fotos descargadas y las detecciones se guardan en la caché de Actions: cada día solo se
#   procesan las fotos nuevas.
# - La clave de Gemini se lee del secreto GEMINI_API_KEY. Si no existe, se omite ese paso.
name: Datos Limoncito

on:
  workflow_dispatch:
  push:
    branches: [datos-automatizacion]
    paths: ["scripts/**", ".github/workflows/datos-limoncito.yml"]
  schedule:
    - cron: "15 12 * * *"   # 12:15 UTC = 6:15 a. m. en Costa Rica

permissions:
  contents: write

concurrency:
  group: datos-limoncito
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: Instalar dependencias (PyTorch sin CUDA)
        run: |
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install -r scripts/requirements.txt

      - name: Recuperar fotos y detecciones de ejecuciones anteriores
        uses: actions/cache@v4
        with:
          path: |
            data/limoncito/fotos
            data/limoncito/cache_deteccion.jsonl
            yolo11s_openvino_model
          key: limoncito-${{ github.run_id }}
          restore-keys: limoncito-

      - name: Correr el proceso completo
        run: bash scripts/actualizar.sh

      - name: Guardar los datos actualizados en el repositorio
        run: |
          git config user.name "datos-limoncito[bot]"
          git config user.email "datos-limoncito@users.noreply.github.com"
          git add data/datos_limoncito.json data/fotos_limoncito.json data/alertas_limoncito.json data/limoncito
          if git diff --cached --quiet; then
            echo "Sin cambios en los datos."
          else
            git commit -m "Datos Limoncito: actualización automática $(date -u +%Y-%m-%d)"
            git push
          fi
